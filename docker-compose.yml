services:
  mysql:
    image: mysql:8.4
    container_name: jwt-pizza-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - jwt-pizza-db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  jwt-pizza-db-data:
